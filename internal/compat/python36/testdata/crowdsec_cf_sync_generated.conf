lua_shared_dict cscf_verdicts    50m;
lua_shared_dict crowdsec_metrics 10m;
lua_shared_dict crowdsec_state    5m;

lua_package_path "/etc/openresty/lua/?.lua;;";

init_by_lua_block {
    require "crowdsec.init"
    require "crowdsec.lookup"
    require "crowdsec.sync"
}

init_worker_by_lua_block {
    require("crowdsec.sync").start()
}
