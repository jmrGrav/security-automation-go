name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -timeout 120s ./...

      - name: go test -race
        run: go test -race -timeout 300s ./...

      - name: govulncheck
        # continue-on-error: known findings in OTEL v1.24.0 and OPA v0.64.1 (pre-existing, deferred).
        # All stdlib findings cleared by go1.25.11. Remaining: OTEL + OPA. See docs/releases/RELEASE_CHECKLIST.md.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-multiarch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            artifact: linux-amd64
          - goarch: arm64
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: true

      - name: Build linux/${{ matrix.goarch }} (all 5 binaries)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin/${{ matrix.artifact }}
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/${{ matrix.artifact }}/crowdsec-sync        ./cmd/crowdsec-sync
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/${{ matrix.artifact }}/cf-allowlist-sync   ./cmd/cf-allowlist-sync
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/${{ matrix.artifact }}/cf-cleanup          ./cmd/cf-cleanup
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/${{ matrix.artifact }}/cf-sync             ./cmd/cf-sync
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o bin/${{ matrix.artifact }}/security-automation-mcp ./cmd/security-automation-mcp

      - name: Upload binaries (${{ matrix.artifact }})
        uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}/
          retention-days: 30

  package-deb:
    runs-on: ubuntu-latest
    needs: build-multiarch
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: true

      - name: Assemble and build .deb
        run: NO_RPM=1 make package

      - name: Upload .deb package
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: dist/*.deb
          retention-days: 30

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Secret Scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: trufflehog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
